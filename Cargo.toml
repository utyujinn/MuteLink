[package]
name = "stt_realtime"
version = "0.1.0"
edition = "2024"

[dependencies]
windows = { version = "0.61", features = [
    "Media_Devices",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_Media_Audio",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
] }
eframe = "0.29"
egui = "0.29"
tungstenite = "0.24"
ureq = "2"
rodio = "0.17"
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
