<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASR test</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>ASR test</h1>

      <div class="row">
        <button id="google-btn">Google STT Start</button>
      </div>
      <p id="google-status">idle</p>

      <hr />

      <h2>VOICEVOX (小夜/SAYO)</h2>
      <div class="row">
        <input id="voicevox-text" size="36" value="こんにちは" />
        <button id="voicevox-btn">Speak</button>
      </div>
      <div class="row">
        <label for="voicevox-outputs">出力先(複数選択可)</label>
        <select id="voicevox-outputs" multiple size="6"></select>
      </div>
      <p id="voicevox-status">idle</p>

      <div id="log"></div>
    </main>
  </body>
</html>
