<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mutelink</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div class="titlebar" data-tauri-drag-region>
      <div class="titlebar-left">
        <span class="titlebar-title">Mutelink</span>
        <button id="settings-btn" class="titlebar-icon-btn" title="設定" aria-label="設定">⚙</button>
      </div>
      <div class="titlebar-controls">
        <button id="titlebar-minimize" class="titlebar-btn" title="最小化" aria-label="最小化">&#x2013;</button>
        <button id="titlebar-maximize" class="titlebar-btn" title="最大化" aria-label="最大化">&#x25A1;</button>
        <button id="titlebar-close" class="titlebar-btn titlebar-btn-close" title="閉じる" aria-label="閉じる">&#x2715;</button>
      </div>
    </div>

    <dialog id="settings-dialog">
      <h2>設定</h2>
      <p>準備中です。</p>
      <div class="row">
        <button id="settings-close-btn">閉じる</button>
      </div>
    </dialog>

    <main class="container">
      <h1>ASR test</h1>

      <div class="row">
        <label for="stt-lang">認識言語</label>
        <select id="stt-lang">
          <option value="ja-JP" selected>日本語</option>
          <option value="en-US">English</option>
          <option value="zh-CN">中文</option>
        </select>
      </div>
      <div class="row">
        <button id="google-btn">Google STT Start</button>
      </div>
      <p id="google-status">idle</p>
      <div class="row">
        <label><input type="checkbox" id="chatbox-toggle" /> VRCチャットボックスへ送信</label>
      </div>

      <hr />

      <h2>VOICEVOX (小夜/SAYO)</h2>
      <div class="row">
        <input id="voicevox-text" size="36" value="こんにちは" />
        <button id="voicevox-btn">Speak</button>
      </div>
      <div class="row">
        <label for="voicevox-outputs">出力先(複数選択可)</label>
        <select id="voicevox-outputs" multiple size="6"></select>
      </div>
      <p id="voicevox-status">idle</p>

      <div id="log"></div>
    </main>
  </body>
</html>
