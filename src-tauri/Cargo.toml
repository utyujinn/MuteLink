[package]
name = "mutelink"
version = "0.1.0"
edition = "2021"

[lib]
name = "mutelink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tungstenite = "0.24"
ureq = "2"
urlencoding = "2"
rodio = "0.17"
cpal = "0.15"
windows = { version = "0.61", features = [
    "Media_Devices",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Win32_System_Com",
    "Win32_Media_Audio",
    "Win32_Foundation",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
